<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#2c3e50" opacity="0.1"/>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#3498db" stroke-width="3" opacity="0.3"/>
  
  <!-- Database Cylinder Stack -->
  <g id="database-stack">
    <!-- Top Database Layer -->
    <ellipse cx="100" cy="70" rx="45" ry="12" fill="#3498db" opacity="0.9"/>
    <rect x="55" y="70" width="90" height="20" fill="#3498db" opacity="0.9"/>
    <ellipse cx="100" cy="90" rx="45" ry="12" fill="#2980b9"/>
    
    <!-- Middle Database Layer -->
    <ellipse cx="100" cy="100" rx="45" ry="12" fill="#3498db" opacity="0.85"/>
    <rect x="55" y="100" width="90" height="20" fill="#3498db" opacity="0.85"/>
    <ellipse cx="100" cy="120" rx="45" ry="12" fill="#2980b9" opacity="0.9"/>
    
    <!-- Bottom Database Layer -->
    <ellipse cx="100" cy="130" rx="45" ry="12" fill="#3498db" opacity="0.8"/>
    <rect x="55" y="130" width="90" height="20" fill="#3498db" opacity="0.8"/>
    <ellipse cx="100" cy="150" rx="45" ry="12" fill="#2980b9" opacity="0.85"/>
  </g>
  
  <!-- Data Connection Lines -->
  <g id="connections" stroke="#1abc9c" stroke-width="2" fill="none" opacity="0.7">
    <line x1="100" y1="60" x2="100" y2="30"/>
    <line x1="100" y1="30" x2="75" y2="20"/>
    <line x1="100" y1="30" x2="125" y2="20"/>
    <circle cx="75" cy="20" r="4" fill="#1abc9c"/>
    <circle cx="125" cy="20" r="4" fill="#1abc9c"/>
    <circle cx="100" cy="30" r="4" fill="#1abc9c"/>
  </g>
  
  <!-- Data Nodes on sides -->
  <g id="side-nodes" opacity="0.8">
    <circle cx="30" cy="100" r="6" fill="#27ae60"/>
    <circle cx="170" cy="100" r="6" fill="#27ae60"/>
    <line x1="55" y1="100" x2="30" y2="100" stroke="#27ae60" stroke-width="2" opacity="0.5"/>
    <line x1="145" y1="100" x2="170" y2="100" stroke="#27ae60" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Analytics Chart Elements -->
  <g id="chart-bars" opacity="0.6">
    <rect x="160" y="140" width="8" height="20" rx="2" fill="#e74c3c"/>
    <rect x="172" y="130" width="8" height="30" rx="2" fill="#f39c12"/>
    <rect x="184" y="125" width="8" height="35" rx="2" fill="#27ae60"/>
  </g>
  
  <!-- Highlight Shine -->
  <ellipse cx="85" cy="75" rx="15" ry="5" fill="white" opacity="0.3"/>
  
  <!-- Bottom Accent Line -->
  <path d="M 55 155 Q 100 165 145 155" stroke="#1abc9c" stroke-width="2" fill="none" opacity="0.5"/>
</svg>